name: Arch build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build against current Arch packages
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            archlinux:latest \
            bash -euc 'pacman -Syu --noconfirm --needed base-devel cargo gtk4 gtk4-layer-shell webkitgtk-6.0; cargo build --release --locked'
