[package]
name = "linux-live-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Interactive web wallpapers for Linux desktops"
license = "MIT"
repository = "https://github.com/pskeffington/linux_live_wallpaper"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.9" }
webkit = { package = "webkit6", version = "0.4" }
gtk4-layer-shell = "0.4"
